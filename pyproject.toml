[build-system]
requires = [
    "setuptools",
    "setuptools-scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "ngo"
authors = [
    { name = "Max Ostrowski", email = "max.ostrowski@potassco.com" }
]
description = "Optimizes non ground logic programs."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dynamic = [ "version" ]
readme = "README.md"

dependencies = [
    "aspen-tree-5 @ git+https://github.com/potassco/aspen-tree.git@clingo-5",
    "clingo>=5.8,<6",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-clingo>=1.0.5,<2",
]

[project.urls]
Homepage = "https://potassco.org/ngo"
Documentation = "https://docs.potassco.org/ngo/"
Repository = "http://github.com/potassco/ngo"

[project.optional-dependencies]
format = [ "black", "isort" ]
lint = [ "pylint==3.2.7", "ngo[test]" ]
typecheck = [ "types-setuptools", "mypy==1.10.1", "ngo[test]" ]
test = [ "pytest", "coverage" ]
doc = [ "pdoc" ]
dev = [ "ngo[test,typecheck,lint,format,doc]", "pre-commit" ]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ngo = ["encodings/**/*.lp", "py.typed"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 12
max-attributes = 7
max-bool-expr = 5
max-branches = 12
max-locals = 30
max-parents = 7
max-public-methods = 20
max-returns = 10
max-statements = 50
min-public-methods = 1

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true

[tool.pylint.basic]
argument-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
variable-rgx = "^[a-z][a-z0-9]*((_[a-z0-9]+)*_?)?$"
good-names = ["_", "M", "N", "B", "A", "Nn", "Bn", "An"]

[tool.pylint.miscellanous]
notes = []

[tool.pylint."messages control"]
disable = ["import-outside-toplevel", "logging-fstring-interpolation"]

[tool.coverage.run]
source = ["ngo"]

[tool.coverage.report]
exclude_lines = ["assert", "nocoverage"]



